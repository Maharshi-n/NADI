services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nadi
      POSTGRES_PASSWORD: nadi
      POSTGRES_DB: nadi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nadi:nadi@db:5432/nadi
      DATABASE_URL_SYNC: postgresql://nadi:nadi@db:5432/nadi
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
